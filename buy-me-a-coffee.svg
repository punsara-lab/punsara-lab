<svg xmlns="http://www.w3.org/2000/svg" width="300" height="56" viewBox="0 0 300 56" role="img" aria-label="Buy me a lavender latte" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDB6FF"/>
      <stop offset="1" stop-color="#9467F5"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EC"/>
      <stop offset="0.45" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="c"><rect width="300" height="56" rx="28"/></clipPath>
    <clipPath id="cup"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/></clipPath>
  </defs>
  <style>
    .steam{fill:none;stroke:#2A1450;stroke-width:1.6;stroke-linecap:round;opacity:0;animation:rise 2.6s ease-in-out infinite}
    .s2{animation-delay:.5s}
    @keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.85}100%{opacity:0;transform:translateY(-6px)}}
    .shine{animation:sweep 4.5s ease-in-out infinite}
    @keyframes sweep{0%,55%{transform:translateX(-90px)}100%{transform:translateX(340px)}}
    .cup{fill:none;stroke:#2A1450;stroke-width:1.6;stroke-linecap:round}
    .sprig{transform-origin:19.5px 19px;animation:sway 3.2s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
    .latte{animation:wave 3s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6px)}}
    text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-weight:600;font-size:17px;fill:#170A2E}
  </style>

  <rect width="300" height="56" rx="28" fill="url(#g)"/>
  <rect x=".75" y=".75" width="298.5" height="54.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
  <g clip-path="url(#c)"><rect class="shine" width="70" height="56" fill="url(#s)"/></g>

  <g transform="translate(34 13) scale(1.2)">
    <path class="steam" d="M9 2c0 1.5 1.5 1.5 1.5 3S9 7 9 8.5"/>
    <path class="steam s2" d="M13.5 2c0 1.5 1.5 1.5 1.5 3s-1.5 1.5-1.5 3"/>
    <g clip-path="url(#cup)"><rect class="latte" x="3" y="11" width="15" height="10" fill="url(#l)"/></g>
    <path class="cup" d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/>
    <path class="cup" d="M17 10.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/>
    <rect x="4" y="20" width="13" height="1.4" rx="0.7" fill="#2A1450"/>
    <g class="sprig">
      <path d="M21.6 19.6 L22 9" stroke="#2A1450" stroke-width="1" stroke-linecap="round" fill="none"/>
      <ellipse cx="22" cy="9.6" rx=".9" ry="1.5" fill="#5B21B6"/>
      <ellipse cx="22.1" cy="12.2" rx=".9" ry="1.5" fill="#5B21B6"/>
      <ellipse cx="22" cy="14.8" rx=".9" ry="1.5" fill="#5B21B6"/>
    </g>
  </g>

  <text x="76" y="34">Buy me a lavender latte</text>
</svg>
