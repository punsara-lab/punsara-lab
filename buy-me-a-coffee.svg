<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56" role="img" aria-label="Buy me a coffee" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0A458"/>
      <stop offset="1" stop-color="#B8733A"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="260" height="56" rx="28"/></clipPath>
  </defs>
  <style>
    .steam{fill:none;stroke:#2A1B0E;stroke-width:1.6;stroke-linecap:round;opacity:0;animation:rise 2.6s ease-in-out infinite}
    .s2{animation-delay:.5s}
    @keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.85}100%{opacity:0;transform:translateY(-6px)}}
    .shine{animation:sweep 4.5s ease-in-out infinite}
    @keyframes sweep{0%,55%{transform:translateX(-90px)}100%{transform:translateX(300px)}}
    .cup{fill:none;stroke:#2A1B0E;stroke-width:1.6;stroke-linecap:round}
    text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-weight:600;font-size:17px;fill:#201309}
  </style>

  <rect width="260" height="56" rx="28" fill="url(#g)"/>
  <g clip-path="url(#c)"><rect class="shine" width="70" height="56" fill="url(#s)"/></g>

  <g transform="translate(38 13) scale(1.2)">
    <path class="steam" d="M9 2c0 1.5 1.5 1.5 1.5 3S9 7 9 8.5"/>
    <path class="steam s2" d="M13.5 2c0 1.5 1.5 1.5 1.5 3s-1.5 1.5-1.5 3"/>
    <path class="cup" d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/>
    <path class="cup" d="M17 10.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/>
    <rect x="4" y="20" width="13" height="1.4" rx="0.7" fill="#2A1B0E"/>
  </g>

  <text x="80" y="34">Buy me a coffee</text>
</svg>
